name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Add Android project files
        run: flutter create --platforms=android --project-name states_capitals .
      - name: Set app name on phone
        run: sed -i 's/android:label="states_capitals"/android:label="States and Capitals"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: states-capitals-apk
          path: build/app/outputs/flutter-apk/app-release.apk
